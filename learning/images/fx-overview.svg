  <text x="92" y="155" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#4A3520">大指　向外</text>
  <text x="92" y="172" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="13" fill="#8A7355">遠離身體 · 往低音</text>
  <rect x="340" y="134" width="278" height="44" rx="8" fill="#FFFFFF" stroke="#D2B48C"/>
  <circle cx="366" cy="156" r="15" fill="#1F6F43"/>
