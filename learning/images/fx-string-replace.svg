<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="更換琴弦">
  <rect width="640" height="380" rx="14" fill="#FBF7EC"/>
  <text x="32" y="46" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="25" font-weight="bold" fill="#4A3520">更換琴弦</text>
  <text x="32" y="74" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" fill="#8A7355">建議步驟</text>
  <line x1="32" y1="88" x2="608" y2="88" stroke="#D2B48C" stroke-width="2"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6F43"/></marker>
    <marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
  </defs>
  <circle cx="66" cy="126" r="16" fill="#8B5A2B"/>
  <text x="66" y="132" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">1</text>
  <text x="94" y="132" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" fill="#4A3520">記錄琴碼位置,或拍照留底</text>
  <line x1="66" y1="142" x2="66" y2="154" stroke="#D2B48C" stroke-width="2.5"/>
  <circle cx="66" cy="170" r="16" fill="#8B5A2B"/>
  <text x="66" y="176" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">2</text>
  <text x="94" y="176" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" fill="#4A3520">鬆開絃軸,取下舊弦</text>
  <line x1="66" y1="186" x2="66" y2="198" stroke="#D2B48C" stroke-width="2.5"/>
  <circle cx="66" cy="214" r="16" fill="#8B5A2B"/>
  <text x="66" y="220" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">3</text>
  <text x="94" y="220" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" fill="#4A3520">新弦穿過弦孔並固定於絃軸</text>
  <line x1="66" y1="230" x2="66" y2="242" stroke="#D2B48C" stroke-width="2.5"/>
  <circle cx="66" cy="258" r="16" fill="#8B5A2B"/>
  <text x="66" y="264" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">4</text>
  <text x="94" y="264" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" fill="#4A3520">轉動絃軸上緊,同時扶正琴碼</text>
  <line x1="66" y1="274" x2="66" y2="286" stroke="#D2B48C" stroke-width="2.5"/>
  <circle cx="66" cy="302" r="16" fill="#8B5A2B"/>
  <text x="66" y="308" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">5</text>
  <text x="94" y="308" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" fill="#4A3520">調至標準音高,靜置後再校正一次</text>
  <rect x="32" y="304" width="576" height="64" rx="9" fill="#FFFFFF" stroke="#D2B48C"/>
  <text x="46" y="326" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" fill="#4A3520">新弦會持續伸長,換弦後數日內需反覆校正音高。</text>
  <text x="46" y="346" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" fill="#4A3520">一次只換一根,避免整體張力驟變使琴碼倒伏。</text>

</svg>
