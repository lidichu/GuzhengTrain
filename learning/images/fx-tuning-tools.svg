<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="調音工具">
  <rect width="640" height="380" rx="14" fill="#FBF7EC"/>
  <text x="32" y="46" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="25" font-weight="bold" fill="#4A3520">調音工具</text>
  <text x="32" y="74" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" fill="#8A7355">古箏調音需要的三樣器具</text>
  <line x1="32" y1="88" x2="608" y2="88" stroke="#D2B48C" stroke-width="2"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6F43"/></marker>
    <marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect x="46" y="106" width="548" height="48" rx="9" fill="#FFFFFF" stroke="#D2B48C"/>
  <circle cx="78" cy="130" r="17" fill="#8B5A2B"/>
  <text x="78" y="136" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">1</text>
  <text x="106" y="126" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" font-weight="bold" fill="#4A3520">調音扳手</text>
  <text x="106" y="146" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="13.5" fill="#8A7355">轉動調音盒內的絃軸,調整琴弦張力</text>
  <rect x="46" y="164" width="548" height="48" rx="9" fill="#FFFFFF" stroke="#D2B48C"/>
  <circle cx="78" cy="188" r="17" fill="#1F6F43"/>
  <text x="78" y="194" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">2</text>
  <text x="106" y="184" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" font-weight="bold" fill="#4A3520">調音器</text>
  <text x="106" y="204" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="13.5" fill="#8A7355">顯示音高是否準確,建議夾式或App</text>
  <rect x="46" y="222" width="548" height="48" rx="9" fill="#FFFFFF" stroke="#D2B48C"/>
  <circle cx="78" cy="246" r="17" fill="#1D4ED8"/>
  <text x="78" y="252" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">3</text>
  <text x="106" y="242" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" font-weight="bold" fill="#4A3520">移碼器</text>
  <text x="106" y="262" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="13.5" fill="#8A7355">移動琴碼作大幅度音高調整</text>
  <rect x="32" y="304" width="576" height="64" rx="9" fill="#FFFFFF" stroke="#D2B48C"/>
  <text x="46" y="326" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" fill="#4A3520">調音時先用調音器確認音高,再以扳手微調絃軸。</text>
  <text x="46" y="346" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" fill="#4A3520">音差過大時才移動琴碼,移動後鄰近各弦都需重新確認。</text>

</svg>
