<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="雙音">
  <rect width="640" height="380" rx="14" fill="#FBF7EC"/>
  <text x="32" y="46" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="25" font-weight="bold" fill="#4A3520">雙音</text>
  <text x="32" y="74" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="16" fill="#8A7355">兩指同時發聲的和音技法</text>
  <line x1="32" y1="88" x2="608" y2="88" stroke="#D2B48C" stroke-width="2"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6F43"/></marker>
    <marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
  </defs>
  <line x1="70" y1="120" x2="570" y2="120" stroke="#B9A78C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="150" x2="570" y2="150" stroke="#B9A78C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="180" x2="570" y2="180" stroke="#C2410C" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="210" x2="570" y2="210" stroke="#B9A78C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="240" x2="570" y2="240" stroke="#B9A78C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="270" x2="570" y2="270" stroke="#C2410C" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="300" x2="570" y2="300" stroke="#B9A78C" stroke-width="2.5" stroke-linecap="round"/>
  <text x="70" y="104" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="14" fill="#8A7355">外側 · 遠離演奏者 · 低音</text>
  <text x="70" y="330" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="14" fill="#8A7355">內側 · 靠近演奏者 · 高音</text>
  <line x1="250" y1="214" x2="250" y2="150" stroke="#C2410C" stroke-width="4" marker-end="url(#ah)" stroke-linecap="round"/>
  <circle cx="250" cy="222" r="21" fill="#C2410C"/>
  <text x="250" y="228" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">大指</text>
  <line x1="250" y1="236" x2="250" y2="300" stroke="#1F6F43" stroke-width="4" marker-end="url(#ah2)" stroke-linecap="round"/>
  <circle cx="250" cy="228" r="21" fill="#1F6F43"/>
  <text x="250" y="234" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">中指</text>
  <line x1="470" y1="244" x2="470" y2="180" stroke="#C2410C" stroke-width="4" marker-end="url(#ah)" stroke-linecap="round"/>
  <circle cx="470" cy="252" r="21" fill="#C2410C"/>
  <text x="470" y="258" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">大指</text>
  <line x1="470" y1="206" x2="470" y2="270" stroke="#1F6F43" stroke-width="4" marker-end="url(#ah2)" stroke-linecap="round"/>
  <circle cx="470" cy="198" r="21" fill="#1F6F43"/>
  <text x="470" y="204" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" font-weight="bold" fill="#fff">食指</text>
  <text x="250" y="276" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="14" font-weight="bold" fill="#8B5A2B">大撮 · 八度</text>
  <text x="470" y="276" text-anchor="middle" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="14" font-weight="bold" fill="#8B5A2B">小撮 · 五度以內</text>
  <rect x="32" y="304" width="576" height="64" rx="9" fill="#FFFFFF" stroke="#D2B48C"/>
  <text x="46" y="326" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" fill="#4A3520">雙音即兩指同時撥弦發聲,依音程分為大撮與小撮。</text>
  <text x="46" y="346" font-family="'Microsoft JhengHei','微軟正黑體',sans-serif" font-size="15" fill="#4A3520">常見錯誤是大指音量偏大、兩音發聲不同時。</text>

</svg>
